---
- name: Install Apache HTTP Server from Source
  hosts: all
  become: true

  vars:
    apache_version: "2.4.68"
    apache_prefix: "/usr/local/apache2"
    apache_url: "https://downloads.apache.org/httpd/httpd-{{ apache_version }}.tar.gz"

  tasks:

    #################################################################
    # Install Build Dependencies
    #################################################################

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - gcc
          - gcc-c++
          - make
          - wget
          - tar
          - perl
          - libtool
          - autoconf
          - automake
          - apr-devel
          - apr-util-devel
          - pcre2-devel
          - openssl-devel
          - expat-devel
          - zlib-devel
          - systemd
        state: present

    #################################################################
    # Create Apache User/Group
    #################################################################

    - name: Create apache group
      ansible.builtin.group:
        name: apache
        system: true

    - name: Create apache user
      ansible.builtin.user:
        name: apache
        group: apache
        system: true
        shell: /sbin/nologin
        home: "{{ apache_prefix }}"
        create_home: false

    #################################################################
    # Download Source
    #################################################################

    - name: Download Apache source tarball
      ansible.builtin.command:
        cmd: >
          wget -O /usr/local/src/httpd-{{ apache_version }}.tar.gz
          {{ apache_url }}
      args:
        creates: "/usr/local/src/httpd-{{ apache_version }}.tar.gz"

    #################################################################
    # Extract Source
    #################################################################

    - name: Extract Apache source
      ansible.builtin.unarchive:
        src: "/usr/local/src/httpd-{{ apache_version }}.tar.gz"
        dest: "/usr/local/src"
        remote_src: true
        creates: "/usr/local/src/httpd-{{ apache_version }}"

    #################################################################
    # Compile and Install Apache
    #################################################################

    - name: Configure, compile and install Apache
      ansible.builtin.shell: |
        ./configure \
          --prefix={{ apache_prefix }} \
          --enable-so \
          --enable-ssl \
          --enable-http2 \
          --enable-rewrite \
          --enable-headers \
          --enable-deflate \
          --enable-expires \
          --with-mpm=event \
          --enable-mods-shared=all

        make -j $(nproc)
        make install
      args:
        chdir: "/usr/local/src/httpd-{{ apache_version }}"
        creates: "{{ apache_prefix }}/bin/httpd"

    #################################################################
    # Configure Apache Runtime User
    #################################################################

    - name: Configure Apache user
      ansible.builtin.lineinfile:
        path: "{{ apache_prefix }}/conf/httpd.conf"
        regexp: '^User'
        line: 'User apache'
      notify: restart apache

    - name: Configure Apache group
      ansible.builtin.lineinfile:
        path: "{{ apache_prefix }}/conf/httpd.conf"
        regexp: '^Group'
        line: 'Group apache'
      notify: restart apache

    #################################################################
    # Add Apache to PATH
    #################################################################

    - name: Add Apache binaries to PATH
      ansible.builtin.copy:
        dest: /etc/profile.d/apache.sh
        mode: '0644'
        content: |
          export PATH=$PATH:{{ apache_prefix }}/bin

    #################################################################
    # Create systemd Service
    #################################################################

    - name: Create Apache systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/httpd.service
        mode: '0644'
        content: |
          [Unit]
          Description=Apache HTTP Server
          After=network.target

          [Service]
          Type=forking
          PIDFile={{ apache_prefix }}/logs/httpd.pid

          ExecStart={{ apache_prefix }}/bin/apachectl start
          ExecReload={{ apache_prefix }}/bin/apachectl graceful
          ExecStop={{ apache_prefix }}/bin/apachectl stop

          User=root
          Group=root

          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    #################################################################
    # Start Apache
    #################################################################

    - name: Enable and start Apache
      ansible.builtin.systemd:
        name: httpd
        enabled: true
        state: started

  handlers:

    - name: restart apache
      ansible.builtin.systemd:
        name: httpd
        state: restarted
